name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-24.04 ломает сборку libffi (autoconf 2.72: LT_SYS_SYMBOL_USCORE) —
    # p4a собирается на 22.04
    runs-on: ubuntu-22.04
    steps:
      - name: Скачать код проекта
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Установить зависимости системы
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf \
              libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
              libffi-dev libssl-dev cmake

      - name: Установить buildozer
        run: pip install buildozer

      - name: Кэш компонентов сборки
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v2-${{ runner.os }}-

      - name: Собрать apk
        run: |
          # yes отвечает "y" на вопросы о лицензиях Android SDK;
          # set +o pipefail, чтобы SIGPIPE от yes (141) не красил успешный шаг
          set +o pipefail
          if yes | buildozer android debug > build.log 2>&1; then
            code=0
          else
            code=$?
          fi
          echo "buildozer exit code: $code"
          exit "$code"

      - name: Показать ошибку сборки
        if: failure()
        run: |
          # убираем ANSI-цвета, затем отрезаем итоговую сводку buildozer'а
          clean=$(perl -pe 's/\e\[[0-9;]*m//g' build.log | sed '/^# Command failed:/,$d')
          line=$(echo "$clean" | grep -n -iE "error|traceback|failed" | tail -1 | cut -d: -f1)
          if [ -z "$line" ]; then
            echo "===== Последние 60 строк лога ====="
            tail -60 build.log
          else
            start=$(( line > 25 ? line - 25 : 1 ))
            echo "===== Лог вокруг ошибки (строка $line) ====="
            echo "$clean" | sed -n "${start},$(( line + 25 ))p"
          fi

      - name: Отправить apk в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: bin/*.apk
          if-no-files-found: error
